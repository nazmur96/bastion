name: Bastion desktop build

# Unsigned Linux and macOS desktop installers with the full managed SSH server template.
# Windows runners qualify server slots. Only manual dispatch starts this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bastion-desktop-build
  cancel-in-progress: false

jobs:
  server-template:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/qualified-orcad-template.yml
    with:
      ref: ${{ github.sha }}
      fast_runners: false

  build:
    needs: server-template
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            script: build:linux
            args: --publish never
            label: linux-x64
          - os: macos-15
            script: build:mac
            # Name the targets explicitly so the default mac config cannot add Intel builds.
            args: dmg:arm64 zip:arm64 --publish never
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # Unsigned builds: no signing identity is discovered or required.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ORCA_BACKGROUND_LAUNCH: '1'
      ORCA_REQUIRE_ORCAD_TEMPLATE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Install rpm tooling for the .rpm package
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The desktop build also bundles the mobile web client, a separate pnpm project.
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Download the qualified server template from this run
        uses: actions/download-artifact@v8
        with:
          name: orcad-template
          path: out/orcad-template
      # Never publish: electron-builder otherwise tries to create a GitHub release on CI.
      - run: pnpm run ${{ matrix.script }} ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: bastion-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.dmg
            dist/*.zip
            dist/*.exe
