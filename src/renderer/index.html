<!doctype html>
<html class="native-shell">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="img-src 'self' data: blob: http: https: file: orca-media: orca-preview: orca-jira-image: orca-plugin-image:"
    />
    <title>Bastion</title>
    <!-- CSP is relaxed during development; electron-vite injects a stricter policy for production builds -->
  </head>

  <body>
    <!-- Shown until the app mounts and replaces it; matches the window's own background colors. -->
    <style>
      .startup-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font:
          13px system-ui,
          sans-serif;
        color: #a3a3a3;
        background: #0a0a0a;
      }
      .startup-splash i {
        width: 14px;
        height: 14px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }
      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: light) {
        .startup-splash {
          color: #525252;
          background: #ffffff;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-splash i {
          animation: none;
        }
      }
    </style>
    <div id="root">
      <div class="startup-splash" role="status"><i aria-hidden="true"></i>Opening Bastion…</div>
    </div>
    <script type="module" src="/src/fork/project-workspaces/desktop-entry.ts"></script>
  </body>
</html>
